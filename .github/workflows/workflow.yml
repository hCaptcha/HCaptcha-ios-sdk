name: ci

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  release:
    types: [published]
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

env:
  XCODE_VERSION: '16.4'
  RUBY_VERSION: '3.1'

jobs:
  test:
    name: Test SDK${{ !matrix.primary && format(' (Xcode {0})', matrix.xcode) || '' }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode: '16.4'
            primary: true
          # App Store uploads require Xcode 26 / iOS 26 SDK since 2026-04-28
          - os: macos-26
            xcode: '26.6'
            primary: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Xcode ${{ matrix.xcode }}
        run: sudo xcode-select --switch /Applications/Xcode_${{ matrix.xcode }}.app

      - name: "Cache dependencies"
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: Carthage/build
          key: ${{ runner.os }}-carthage-v2-${{ hashFiles('**/Cartfile.resolved') }}
          restore-keys: |
            ${{ runner.os }}-carthage-v2

      - uses: ruby/setup-ruby@922ebc4c5262cd14e07bb0e1db020984b6c064fe
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - run: bundle exec fastlane test
        timeout-minutes: 25

  sources-lint:
    name: Lint Source files
    needs: test
    permissions:
      contents: read
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -switch /Applications/Xcode_${XCODE_VERSION}.app

      - uses: ruby/setup-ruby@922ebc4c5262cd14e07bb0e1db020984b6c064fe
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Install SwiftLint 0.43.1
        run: |
          curl -fLsS --retry 3 https://github.com/realm/SwiftLint/releases/download/0.43.1/portable_swiftlint.zip -o "$RUNNER_TEMP/swiftlint.zip"
          echo "eb7f66d7a5f691eefb56ede73fa42a1aef9060e67f3112b864cb5dac35ec2dc4  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - run: bundle exec fastlane swift_lint

      - run: bundle exec fastlane html_lint

      - run: bundle exec fastlane xcprivacy_lint

  carthage-build:
    name: Carthage Build
    needs: test
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode: '16.4'
            experimental: false
          - os: macos-26
            xcode: '26.6'
            experimental: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Xcode ${{ matrix.xcode }}
        run: sudo xcode-select --switch /Applications/Xcode_${{ matrix.xcode }}.app

      - uses: ruby/setup-ruby@922ebc4c5262cd14e07bb0e1db020984b6c064fe
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - run: brew upgrade carthage

      - run: bundle exec fastlane carthage_build

  swift-package-build:
    name: Swift Package Build${{ !matrix.primary && format(' (Xcode {0})', matrix.xcode) || '' }}
    needs: test
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode: '16.4'
            primary: true
          - os: macos-26
            xcode: '26.6'
            primary: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Xcode ${{ matrix.xcode }}
        run: sudo xcode-select --switch /Applications/Xcode_${{ matrix.xcode }}.app

      - uses: ruby/setup-ruby@922ebc4c5262cd14e07bb0e1db020984b6c064fe
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - run: bundle exec fastlane spm_build

  samples:
    name: Build Samples
    needs: test
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode: '16.4'
            experimental: false
          - os: macos-26
            xcode: '26.6'
            experimental: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Xcode ${{ matrix.xcode }}
        run: sudo xcode-select --switch /Applications/Xcode_${{ matrix.xcode }}.app

      - uses: ruby/setup-ruby@922ebc4c5262cd14e07bb0e1db020984b6c064fe
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - run: bundle exec fastlane ios samples_build

  release:
    name: Release
    if: github.event_name == 'release'
    needs:
      - sources-lint
      - carthage-build
      - swift-package-build
      - samples
    permissions:
      contents: write
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Use Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -switch /Applications/Xcode_${XCODE_VERSION}.app

      - uses: ruby/setup-ruby@922ebc4c5262cd14e07bb0e1db020984b6c064fe
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          bundle exec fastlane release
