<html>
  <head>
    <meta name="viewport" content="width=device-width" />
    <script type="text/javascript">
      window.onerror = function(msg, url, line, column, error) {
        if (window.webkit) {
          window.webkit.messageHandlers.hcaptcha.postMessage({ "error": 1 });
        } else {
          console.log("Error:", error);
        }
      };
    </script>
    <script type="text/javascript">
      var key = "${apiKey}";
      var endpoint = "${endpoint}";
      var rqdata = "${rqdata}";
      var theme = ${theme};
      var debugInfo = JSON.parse('${debugInfo}');

      // Controls what happens on page load:
      //   "didLoad"       — normal: posts didLoad (default)
      //   "networkError"  — posts error 7 (permanent network failure)
      //   "networkOnce"   — posts error 7 on first load, didLoad on reload
      var onLoadBehavior = "${onLoad}";

      // Controls what execute() returns:
      //   "sessionTimeout" — posts error 15
      //   any other value  — evaluated as JS expression and posted
      var onExecuteBehavior = "${onExecute}";

      var loadCount = parseInt(sessionStorage.getItem("loadCount") || "0");

      const themeType = typeof theme;
      console.assert(themeType === "string" || themeType === "object", "invalid theme object");
      console.assert(Array.isArray(debugInfo), "invalid type");

      var post = function(value) {
          window.webkit.messageHandlers.hcaptcha.postMessage(value);
      };

      var token = null;

      var validateVerifyParams = function(params) {
          try {
              if (typeof params !== 'object' || params === null) {
                  post({"log": "bad object type"});
                  return 34;
              }

              var phonePrefix = params.phonePrefix;
              var phoneNumber = params.phoneNumber;

              if (phonePrefix !== undefined) {
                  if (typeof phonePrefix !== 'string') {
                      post({"log": "bad type phonePrefix"});
                      return 34;
                  }
                  var phonePrefixRegex = /^\+?[1-9]\d{0,3}$/;
                  if (!phonePrefixRegex.test(phonePrefix)) {
                      post({"log": "malformed phonePrefix"});
                      return 34;
                  }
              }

              if (phoneNumber !== undefined) {
                  if (typeof phoneNumber !== 'string') {
                      post({"log": "bad type phoneNumber"});
                      return 34;
                  }
                  var phoneNumberRegex = /^\+?[1-9]\d{6,14}$/;
                  if (!phoneNumberRegex.test(phoneNumber)) {
                      post({"log": "malformed phoneNumber"});
                      return 34;
                  }
              }

              if (params.resetOnError !== undefined && typeof params.resetOnError !== 'boolean') {
                  post({"log": "bad type resetOnError"});
                  return 34;
              }

              if (params.rqdata !== undefined && typeof params.rqdata !== 'string') {
                  return 34;
              }

              if (
                phonePrefix === undefined &&
                phoneNumber === undefined &&
                params.rqdata === undefined &&
                params.userJourney === undefined
              ) {
                  return 34;
              }

              return null;
          } catch (e) {
              post({"log": "validateVerifyParams exception " + e.message});
              return 34;
          }
      };

      // Mock hcaptcha.setData to accept userJourney and immediately post a token
      var hcaptcha = {
          setData: function(containerId, data) {
              try {
                  if (data && data.userJourney) {
                      token = "journeys:setData";
                  }
              } catch (e) {
              }
          }
      };

      var execute = function(verifyParams) {
          if (onExecuteBehavior === "sessionTimeout") {
              post({error: 15});
          } else {
              if (verifyParams) {
                  var validationError = validateVerifyParams(verifyParams);
                  if (validationError) {
                      post({error: validationError});
                      return;
                  }
                  post({"log": "verifyParams: " + JSON.stringify(verifyParams)});
              }

              var messageToPost = ${message};
              if (rqdata) {
                  post({"log": rqdata});
              }
              if (messageToPost.action === "openExternalPage") {
                  document.getElementById("external-link").click();
              } else if (messageToPost.action === "sms") {
                  window.open("sms:+123-456-789?body=somebody-someone")
              }
              messageToPost.token = token || messageToPost.token;
              post(messageToPost);
              if (messageToPost && messageToPost.token || messageToPost.action === "showHCaptcha") {
                  setTimeout(function() {
                      post({ action: "onOpen" });
                  }, 100);
              }
          }
      };

      var reset = function() {
          onExecuteBehavior = "normal";
          post({ action: "didLoad" });
      };

      loadCount++;
      sessionStorage.setItem("loadCount", loadCount.toString());
      switch (onLoadBehavior) {
          case "networkError":
              post({ error: 7 });
              break;
          case "networkOnce":
              if (loadCount <= 1) {
                  post({ error: 7 });
              } else {
                  post({ action: "didLoad" });
              }
              break;
          default:
              post({ action: "didLoad" });
              break;
      }

      window.onerror = null;
    </script>
  </head>
  <body>
    <span id="submit" style="visibility: hidden;"></span>
    <a id="external-link" target="_blank" href="https://hcaptcha.com" rel="noopener">Test external</a>
  </body>
</html>
